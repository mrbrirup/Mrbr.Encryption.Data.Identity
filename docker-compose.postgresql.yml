services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mrbr_test
      POSTGRES_PASSWORD: mrbr_test_password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrbr_test -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
